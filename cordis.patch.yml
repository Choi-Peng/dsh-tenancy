# @choi-p/dsh-tenancy — bundle patch layer
# Mounted as the LAST profile bundle so its shadow routes register after core
# services exist (registration order is irrelevant to matching: exact beats
# prefix in dsh-host-webserver, but keep layering readable anyway).
#
# NOTE: set sharedSecret to the same value Caddy injects via
#   header_up X-Dsh-Tenancy-Key "{env.DSH_TENANCY_SECRET}"
# (see /etc/caddy/dsh.env). Empty string disables the secret check.
- insert:
    - id: tenancy
      name: '@choi-p/dsh-tenancy'
      config:
        identityHeader: remote-user
        groupsHeader: remote-groups
        sharedSecret: ''                # 部署时必须与 /etc/caddy/dsh.env 的 DSH_TENANCY_SECRET 同值
                                        # (本机已在 profile cordis.patch.yml 覆盖为实际密钥)
                                        # ⚠ 非空后未带 X-Dsh-Tenancy-Key 的请求一律 401（不再回落 local）
        trustedHosts: []                # 公网域名必填，如 ['dsh.example.com']：影子路由自己的
                                        # browser-trust 围栏用它判定 Host 是否可信（loopback 永远可信）；
                                        # 缺省时 /register 与域名直入的 /tenancy/* 会被 403（启动时打 WARN）
        adminGroups:
          - dsh-admins
        localPrincipal: local
        localIsAdmin: true
        defaultAccess: private          # private | team-read | team-rw
        hideEmptyWorkspaces: true
        hardenRespond: true             # P3:影子接管 /api/respond 做 rpcId→会话归属校验
        auditPath: ''                   # 空 → $DSH_HOME/tenancy/audit.log
        dbPath: ''                      # 空 → $DSH_HOME/tenancy/acl.json
        memberWorkspaceRoot: '~/dsh'    # P4:非管理员成员的工作空间围栏根(支持 ~/ 展开);
                                        # 目录浏览/建目录/建工作区/显式会话 cwd 全部围在此目录内。
                                        # 置空则这些方法对成员回落 admin-only(旧行为)
        registerEnabled: true           # P4:邀请码注册(/register 公开页 + /tenancy/invites*)
        registerGroup: dsh-team         # 注册用户加入的组(绝不写 admin 组)
        autheliaUsersPath: /etc/authelia/users.yml   # Authelia file 后端用户库(须可写)
        autheliaBin: /opt/authelia/authelia          # 生成 argon2id 哈希的 CLI
        invitesPath: ''                 # 空 → $DSH_HOME/tenancy/invites.json
                                        # ⚠ 多实例共享 $DSH_HOME 时必须逐实例唯一(同 dbPath 红线)
        # ── P12:系统用户自动开通(注册 1:1 建号)──
        # 新成员注册成功即创建同名 Linux 账号:useradd -M -s nologin,无密码(shadow 固有
        # 锁定)、不进任何管理组 ⇒ 不可登录服务器;其唯一文件权限是个人工作区
        # memberWorkspaceRoot/<user>(默认 /root/dsh/<user>):递归 chown + 目录 0700。
        # 依赖 dsh 以 root 运行且有 useradd/getent;存量成员可经 POST /tenancy/sysuser 补建。
        # 注意:/root 常为 0750,系统用户无法穿越抵达 —— 按需 chmod o+x /root(仅穿越、
        # 不可列目录)或 setfacl -m u:<user>:x /root,插件只告警不擅改。
        systemUserEnabled: true         # 总开关(schema 默认 false;需 root)
        systemUserShell: /usr/sbin/nologin   # 不存在时回落 /sbin/nologin → /bin/false
        systemUserChown: true           # 个人工作区递归 chown 给系统用户(目录 0700)
        # ── P11:公开站点(pub.example.com/<user>/<projectName>)──
        # 独立端口匿名静态发布:nginx/Caddy 把公开域名转发到 publicSitesPort,
        # URL 的 <user>/<projectName> 映射到 memberWorkspaceRoot/<user>/<projectName>/<publicBuildDir>
        # 的构建产物(无鉴权、只读;路径逐段校验 + realpath 双重围栏,详见 lib/sites.js)。
        publicSitesEnabled: true        # 总开关(schema 默认 true;自测等裸配置调用方须显式置 true 才启动)
        publicSitesHost: '127.0.0.1'    # 仅回环:公开域名由代理转发到此端口(勿绑 0.0.0.0)
        publicSitesPort: 3089           # 公开站点端口(主站 3088 之外独立)
        publicSitesHosts: []            # Host 白名单,生产建议 ['pub.example.com'](空=任意 Host)
        publicBuildDir: dist            # 项目内构建输出子目录名
        publicSpaFallback: true         # 无扩展名未命中回落 index.html(SPA 路由)
        publicCacheControl: 'public, max-age=300'
