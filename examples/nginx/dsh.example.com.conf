server {
    listen 443 ssl;
    http2 on;
    server_name <dsh.example.com>; # 替换为你的域名

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript application/xml
               application/xml+rss image/svg+xml application/manifest+json;

    # 静态资源强缓存
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|json|map)$ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/events.mux {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/events.host {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # better-sidebar 终端 WS —— 缺升级头则握手失败(浏览器报 …/sidebar/ws/agent-terminals failed)
    location ^~ /sidebar/ws/ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Authelia 门户（同域子路径挂载，server.path=auth）
    location = /auth { return 301 /auth/; }
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # P4:在门户页面注入「邀请码注册」入口(sub_filter 要求上游返回未压缩 HTML,
        # 故必须置空 Accept-Encoding;Authelia 门户尊重该头)
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<a href="/register" style="position:fixed;right:18px;bottom:16px;z-index:9999;padding:8px 16px;border-radius:8px;background:#4f6ef7;color:#fff;text-decoration:none;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25)">邀请码注册</a></body>';
        sub_filter_once on;
    }

    # 主路由：必须显式转发 Host！
    # nginx 默认会把 Host 改成 proxy_pass 里的 127.0.0.1:3088($proxy_host)，
    # dsh 的 /api 信任围栏会校验 Origin 的 host == Host 的 host，
    # 浏览器带 Origin: https://dsh.example.com 而后端看到 Host: 127.0.0.1:3088
    # → 所有 /api 请求 403。
    location / {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # sub_filter 手机端缩放
        proxy_set_header Accept-Encoding "";
        sub_filter 'name="viewport" content="width=device-width, initial-scale=1"'
                   'name="viewport" content="width=device-width, initial-scale=0.7"';
        sub_filter_once on;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/<dsh.example.com>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<dsh.example.com>/privkey.pem;
}
